<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pulsegrid — 16-Step Drum Machine</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Syne:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="bg-noise" aria-hidden="true"></div>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div class="logo" aria-hidden="true">
          <span></span><span></span><span></span><span></span>
        </div>
        <div>
          <h1>PULSEGRID</h1>
          <p class="tag">16-step analog-style sequencer</p>
        </div>
      </div>
      <div class="transport">
        <button id="playBtn" class="play-btn" type="button" aria-label="Play">
          <svg class="icon-play" viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M8 5v14l11-7z"/></svg>
          <svg class="icon-stop" viewBox="0 0 24 24" width="18" height="18"><rect fill="currentColor" x="6" y="6" width="12" height="12" rx="1"/></svg>
          <span class="play-label">PLAY</span>
        </button>
        <div class="bpm-wrap">
          <label for="tempo">TEMPO</label>
          <div class="bpm-row">
            <button type="button" id="tempoDown" class="nudge" aria-label="Slower">−</button>
            <input id="tempo" type="range" min="60" max="180" value="120" />
            <button type="button" id="tempoUp" class="nudge" aria-label="Faster">+</button>
            <span class="bpm-readout"><strong id="bpmVal">120</strong><small>BPM</small></span>
          </div>
        </div>
        <div class="swing-wrap">
          <label for="swing">SWING</label>
          <div class="swing-row">
            <input id="swing" type="range" min="0" max="70" value="0" />
            <span id="swingVal">0%</span>
          </div>
        </div>
      </div>
    </header>

    <section class="grid-card">
      <div class="step-numbers" id="stepNumbers"></div>
      <div class="tracks" id="tracks"></div>
    </section>

    <footer class="controls">
      <div class="pattern-actions">
        <button type="button" id="clearBtn" class="ghost">CLEAR</button>
        <button type="button" id="randomBtn" class="ghost accent">RANDOMIZE</button>
      </div>
      <div class="meters">
        <div class="led" id="runLed"></div>
        <span class="status" id="status">STOPPED · 4/4 · 16 STEPS</span>
      </div>
      <div class="hint">Click pads to program · Space to play/stop</div>
    </footer>
  </div>
  <script src="app.js"></script>
</body>
</html>
